<style>
:root{
  --ink:#3B2A5A; --ink2:#6B5A8C; --paper:#FFFDF7; --pink:#FF5FA2; --pinkd:#D93F83;
  --gold:#FFC83D; --goldd:#D89A12; --mint:#39C79A; --mintd:#23996F; --sky:#6EC6FF;
  --font:"Baloo Bhaijaan 2", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:linear-gradient(180deg,#8FD0FF 0%,#C9E8FF 48%,#FFDDEE 100%);font-family:var(--font);color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font-family:var(--font);color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.hud{position:fixed;inset:0;pointer-events:none;z-index:5}
.hud > *{pointer-events:auto}
.topbar{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));inset-inline:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.topbar > *{pointer-events:auto}
.stats{display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:2px 14px 0 6px;box-shadow:0 4px 0 var(--ink);font-weight:800;font-size:24px;line-height:1.3;font-variant-numeric:tabular-nums;white-space:nowrap}
[dir=rtl] .pill{padding:2px 6px 0 14px}
.pill img{width:28px;height:28px;display:block}
.pill.small{font-size:18px}
.pill.boost{background:var(--pink);color:#fff}
.btns{display:flex;gap:8px}
.ibtn{width:48px;height:48px;border-radius:16px;background:var(--paper);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;padding:0;font-weight:800;font-size:17px}
.ibtn:active,.cbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ibtn svg{width:26px;height:26px}
.quest{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);padding:6px 12px 8px;width:min(250px,56vw);display:flex;gap:10px;align-items:center}
.quest img{width:40px;height:40px;flex:none}
.quest .qb{flex:1;min-width:0}
.quest .ql{font-size:12px;font-weight:800;color:var(--pinkd);letter-spacing:.06em;text-transform:uppercase;line-height:1.1}
[dir=rtl] .quest .ql{letter-spacing:0}
.quest .qt{font-size:15px;font-weight:800;line-height:1.2;margin:1px 0 4px;overflow-wrap:anywhere}
.bar{height:10px;border-radius:99px;background:#EDE6F7;border:2px solid var(--ink);overflow:hidden}
.bar > i{display:block;height:100%;width:0;background:var(--pink);border-radius:99px;transition:width .2s}
.quest .qr{display:flex;align-items:center;gap:3px;font-size:13px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.quest .qr img{width:16px;height:16px}
.side{position:absolute;inset-inline-end:12px;top:calc(76px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.cbtn{border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);padding:4px 10px 2px;font-weight:800;font-size:15px;line-height:1.15;display:flex;flex-direction:column;align-items:center;min-width:74px;color:#fff}
.cbtn b{font-size:22px;line-height:1}
.cbtn small{font-size:11px;display:flex;align-items:center;gap:3px;opacity:.95}
.cbtn.pink{background:var(--pink)}
.cbtn.mint{background:var(--mint);animation:bob 1.1s ease-in-out infinite}
.cbtn[disabled]{filter:saturate(.4);opacity:.85}
@keyframes bob{50%{transform:translateY(-5px) rotate(-3deg)}}
.tip{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding:8px 18px 6px;font-size:19px;font-weight:800;text-align:center;width:max-content;max-width:min(88vw,520px);line-height:1.3;pointer-events:none}
.tip.hint{background:var(--ink);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.2);bottom:calc(90px + env(safe-area-inset-bottom,0px));font-size:17px}
.toast{position:absolute;left:50%;top:calc(120px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:6px 18px 4px;font-size:18px;font-weight:800;white-space:nowrap;pointer-events:none;animation:toast 2.4s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-10px) scale(.9)}10%{opacity:1;transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-6px)}}
.vip{position:absolute;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));background:var(--gold);border:3px solid var(--ink);border-radius:999px;box-shadow:0 4px 0 var(--ink);padding:2px 14px 0;font-weight:800;font-size:17px;display:flex;gap:8px;align-items:center;white-space:nowrap;font-variant-numeric:tabular-nums;pointer-events:none}
.vip img{width:26px;height:26px}
.float{position:fixed;z-index:6;pointer-events:none;font-weight:800;font-size:20px;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;animation:floatUp 1s ease-out forwards;transform:translate(-50%,-50%);font-variant-numeric:tabular-nums}
@keyframes floatUp{to{transform:translate(-50%,-160%);opacity:0}}
#joy{position:fixed;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.35);border:3px solid rgba(59,42,90,.55);transform:translate(-50%,-50%);pointer-events:none;z-index:4}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(540px,calc(100% - 24px));max-height:min(62%,560px);display:flex;flex-direction:column;background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);z-index:8;animation:up .25s ease}
@keyframes up{from{transform:translate(-50%,30px);opacity:0}}
.sheet header{display:flex;align-items:center;gap:10px;padding:10px 12px 6px 16px;border-bottom:3px dashed #E4DAF2}
[dir=rtl] .sheet header{padding:10px 16px 6px 12px}
.sheet header img{width:34px;height:34px}
.sheet h2{margin:0;font-size:24px;line-height:1.1;flex:1;text-wrap:balance}
.sheet .x{width:40px;height:40px;border-radius:12px;border:3px solid var(--ink);background:#fff;font-size:20px;font-weight:800;box-shadow:0 3px 0 var(--ink);padding:0}
.sheet .body{overflow:auto;padding:8px 12px 12px;display:flex;flex-direction:column;gap:8px}
.up{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:#F6F1FC;border-radius:16px;padding:6px 8px}
.up img{width:44px;height:44px}
.up .n{font-weight:800;font-size:17px;line-height:1.1}
.up .d{font-size:13px;color:var(--ink2);font-weight:600;line-height:1.2}
.dots{display:flex;gap:3px;margin-top:3px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:#DCD2EA;border:1.5px solid var(--ink)}
.dots i.on{background:var(--pink)}
.buy{border:3px solid var(--ink);border-radius:14px;background:var(--gold);box-shadow:0 3px 0 var(--ink);font-weight:800;font-size:16px;padding:3px 10px 1px;display:flex;align-items:center;gap:4px;min-width:84px;justify-content:center;font-variant-numeric:tabular-nums}
.buy img{width:18px;height:18px}
.buy[disabled]{background:#E8E1F0;color:#9A8FB0;box-shadow:0 3px 0 #9A8FB0;border-color:#9A8FB0}
.buy.max{background:var(--mint);color:#fff}
.pres p{margin:0;font-size:16px;font-weight:600;line-height:1.35}
.pres .big{display:flex;align-items:center;justify-content:center;gap:10px;font-size:36px;font-weight:800;padding:6px 0}
.pres .big img{width:48px;height:48px}
.wide{border:3px solid var(--ink);border-radius:16px;background:var(--pink);color:#fff;box-shadow:0 4px 0 var(--ink);font-weight:800;font-size:20px;padding:8px 12px 5px;width:100%}
.wide[disabled]{background:#E8E1F0;color:#9A8FB0;border-color:#9A8FB0;box-shadow:0 4px 0 #9A8FB0}
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px;background:linear-gradient(180deg,rgba(143,208,255,.55),rgba(255,221,238,.7));text-align:center}
.logo{font-size:clamp(46px,11vw,92px);font-weight:800;line-height:.95;color:#fff;-webkit-text-stroke:10px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--ink);margin:0;text-wrap:balance;max-width:14ch}
.logo span{color:var(--pink);display:block}
.tag{font-size:clamp(17px,4.2vw,22px);font-weight:800;margin:0;max-width:30ch;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:6px 14px 4px}
.langs{display:flex;gap:10px}
.langs button{border:3px solid var(--ink);border-radius:16px;background:#fff;font-weight:800;font-size:19px;padding:6px 18px 3px;box-shadow:0 4px 0 var(--ink);min-width:120px}
.langs button[aria-pressed=true]{background:var(--gold)}
.play{border:4px solid var(--ink);border-radius:26px;background:var(--pink);color:#fff;font-weight:800;font-size:34px;padding:8px 54px 4px;box-shadow:0 7px 0 var(--ink);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.play:active{transform:translateY(4px);box-shadow:0 3px 0 var(--ink);animation:none}
.lbl{font-size:14px;font-weight:800;color:var(--ink2);margin-bottom:-6px}
.ad{position:fixed;inset:0;z-index:20;background:rgba(30,20,50,.86);display:grid;place-items:center;padding:16px}
.ad .card{background:var(--paper);border:3px solid var(--ink);border-radius:24px;padding:18px 22px;text-align:center;box-shadow:0 6px 0 #000;width:min(360px,100%)}
.ad .tagad{display:inline-block;background:var(--gold);border:2px solid var(--ink);border-radius:8px;padding:0 8px;font-weight:800;font-size:14px}
.ad h3{margin:10px 0 4px;font-size:22px}
.ad .cd{font-size:56px;font-weight:800;line-height:1;margin:8px 0 0;font-variant-numeric:tabular-nums}
.loading{position:fixed;inset:0;display:grid;place-items:center;z-index:30;background:linear-gradient(180deg,#8FD0FF,#FFDDEE)}
.loading i{width:56px;height:56px;border-radius:50%;border:6px solid #fff;border-top-color:var(--pink);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:420px){.pill{font-size:20px}.pill img{width:24px;height:24px}.tip{font-size:16px}.quest .qt{font-size:14px}}
@media (prefers-reduced-motion:reduce){.cbtn.mint,.play{animation:none}}
</style>
</head>

  var d=t.d, ctx=t.ct.ctx, paid=S.paid[d.id]||0, left=Math.max(0,d.cost-paid), fr=d.cost?paid/d.cost:0;

function unlock(id, silent){

}

function bridgePath(fromZ,toZ){ var pts=[]; var z=fromZ; while(z!==toZ){ var n=z<toZ?z+1:z-1; var a=ZC[z]+(n>z?-12.8:12.8), b=ZC[n]+(n>z?12.8:-12.8); pts.push(new THREE.Vector3(0,0,a),new THREE.Vector3(0,0,b)); z=n; } return pts; }
function pathTo(from,to){ var fz=zoneOf(from.z), tz=zoneOf(to.z); var p=bridgePath(fz,tz); p.push(to.clone()); return p; }
function botJobs(b){
  var jobs=[], z=b.z;
  if(b.kind==='harvest'){
    Object.keys(sources).forEach(function(k){ var s=sources[k]; if(s.z!==z || readyCount(s)<1) return;
      Object.keys(machines).forEach(function(mk){ var m=machines[mk]; if(m.z!==z || !mAccepts(m,s.raw)) return; jobs.push({kind:'src',src:s,item:s.raw,to:m,score:(24-m.inBuf[s.raw])+readyCount(s)}); }); });
  } else if(b.kind==='courier'){
    Object.keys(machines).forEach(function(mk){ var m=machines[mk]; if(m.z!==z || m.out<1) return; var it=m.t.out;
      Object.keys(stalls).forEach(function(sk){ var st=stalls[sk]; if(st.z!==z || st.products.indexOf(it)<0 || st.shelf[it]>=40) return; jobs.push({kind:'mach',from:m,item:it,toStall:st,score:m.out+(40-st.shelf[it])*0.5}); });
      Object.keys(machines).forEach(function(mk2){ var m2=machines[mk2]; if(m2.z!==z || m2===m || !mAccepts(m2,it)) return; jobs.push({kind:'mach',from:m,item:it,to:m2,score:m.out+(24-m2.inBuf[it])}); }); });
  } else if(b.kind==='freight'){
    var fm=machines[b.def.from], tm=machines[b.def.to];
    if(fm && tm && fm.out>0 && mAccepts(tm,fm.t.out)) jobs.push({kind:'mach',from:fm,item:fm.t.out,to:tm,score:1});
  }
  jobs.sort(function(a,c){ return c.score-a.score; }); return jobs[0]||null;
}
function moveBot(b,dt){
  var tg=b.path[0]; if(!tg) return true; var dx=tg.x-b.pos.x, dz=tg.z-b.pos.z, d=Math.hypot(dx,dz), s=botSpeed()*dt;
  if(d<=s){ b.pos.x=tg.x; b.pos.z=tg.z; b.path.shift(); return b.path.length===0; }
  b.pos.x+=dx/d*s; b.pos.z+=dz/d*s; b.g.rotation.y=Math.atan2(dx,dz); return false;
}
function updateBots(dt){
  var cap=botCap(), tt=performance.now()/1000;
  bots.forEach(function(b){
    b.t-=dt;
    switch(b.state){
      case 'idle': if(b.t<=0){ var j=botJobs(b); if(j){ b.job=j; b.state='toSrc'; b.path=pathTo(b.pos, j.kind==='src'?j.src.pos.clone():j.from.outPos.clone()); } else { b.t=0.8; if(Math.random()<0.4){ b.path=[b.home.clone().add(new THREE.Vector3(rnd(-1,1),0,rnd(-1,1)))]; b.state='wander'; } } } break;
      case 'wander': if(moveBot(b,dt)){ b.state='idle'; b.t=0.5; } break;
      case 'toSrc': if(moveBot(b,dt)){ b.state='load'; b.t=0; } break;
      case 'load':
        if(b.t<=0){ b.t=0.16/(1+0.1*lvl('botSpeed')); var j2=b.job, got=false;
          if(b.stack.length<cap){ if(j2.kind==='src'){ var from=takeFromSource(j2.src,j2.src.pos,3); if(from){ b.stack.push(j2.item); got=true; S.stats.harvest[j2.item]=(S.stats.harvest[j2.item]||0)+1; fly(j2.item,from,(function(bb){return function(){ return bb.carry.localToWorld(new THREE.Vector3(0,bb.stack.length*ITEM_H,0)); };})(b),0.2); } }
            else if(j2.from.out>0){ j2.from.out--; j2.from.visDirty=true; b.stack.push(j2.item); got=true; } }
          if(got) b.visDirty=true;
          if(!got || b.stack.length>=cap){ if(b.stack.length){ b.state='toDst'; var dest=j2.toStall?j2.toStall.sellPos.clone():j2.to.inPos.clone(); b.path=pathTo(b.pos,dest); } else { b.state='idle'; b.t=0.4; } } }
        break;
      case 'toDst': if(moveBot(b,dt)){ b.state='unload'; b.t=0; } break;
      case 'unload':
        if(b.t<=0){ b.t=0.12; var j3=b.job, it=b.stack[b.stack.length-1];
          if(it && j3.toStall && j3.toStall.shelf[it]<40){ b.stack.pop(); j3.toStall.shelf[it]++; j3.toStall.visDirty=true; b.visDirty=true; }
          else if(it && j3.to && mAccepts(j3.to,it)){ b.stack.pop(); j3.to.inBuf[it]++; j3.to.visDirty=true; b.visDirty=true; }
          else { if(b.stack.length){ /* can't drop: wait */ b.t=1; if(Math.random()<0.2){ b.state='idle'; } } else { b.state='idle'; b.t=0.2; b.job=null; } }
          if(!b.stack.length){ b.state='idle'; b.t=0.2; b.job=null; } }
        break;
    }
    if(b.state==='idle' && b.stack.length){ // leftover: try to deliver to any valid place
      var alt=null; Object.keys(machines).forEach(function(k){ if(!alt && machines[k].z===b.z && mAccepts(machines[k],b.stack[0])) alt={to:machines[k]}; });
      Object.keys(stalls).forEach(function(k){ var st=stalls[k]; if(!alt && st.z===b.z && st.products.indexOf(b.stack[0])>=0) alt={toStall:st}; });
      if(b.kind==='freight' && machines[b.def.to]) alt={to:machines[b.def.to]};
      if(alt){ b.job=alt; b.state='toDst'; b.path=pathTo(b.pos,alt.toStall?alt.toStall.sellPos.clone():alt.to.inPos.clone()); }
    }
    b.g.position.set(b.pos.x,Math.sin(tt*3+b.bob)*0.1,b.pos.z); b.prop.rotation.y+=dt*18;
    if(b.visDirty) layoutStack(b,b.carry,8);
  });
}

  $('boostB').textContent='×2'; $('giftS').textContent=l.giftS; $('hint').textContent=l.drag;

  renderQuest(); if(sheetKind) openSheet(sheetKind);
}
function setLang(lg){
  LANG=lg==='ar'?'ar':'en'; renderStaticText();
  for(var k in tiles) drawTile(tiles[k]);
  signs.forEach(function(s){ if(s.kind==='zone') drawSign(s.obj.ct,L().zones[s.z]); else if(s.kind==='stall') drawSign(s.obj.ct,L().names[s.id],'#FFFDF7'); else drawSign(s.obj.ct,L().names[s.id]); });
  customers.forEach(drawBubble);
  if(inTut()) $('tip').textContent=L().tut[S.tut]||'';
  dirty=true;
}
var SVG_ON='<svg viewBox="0 0 24 24" fill="none" stroke="#3B2A5A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="#FFC83D"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
var SVG_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="#3B2A5A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="#DCD2EA"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
function renderMute(){ var on=!S.muted && AudioSys.ytOn; $('btnMute').innerHTML=on?SVG_ON:SVG_OFF; $('btnMute').setAttribute('aria-pressed',!on); }

/* ================= sheets ================= */
var sheetKind=null;
function openSheet(kind){
  sheetKind=kind; var sh=$('sheet'), l=L(); sh.hidden=false; sh.innerHTML='';
  var hd=document.createElement('header'); var im=document.createElement('img'); im.src=iconURL(kind==='workshop'?'gear':'crown',72); im.alt='';
  var h2=document.createElement('h2'); h2.textContent=kind==='workshop'?l.workshop:l.presTitle; var x=document.createElement('button'); x.className='x'; x.textContent='✕'; x.setAttribute('aria-label','Close'); x.onclick=function(){ AudioSys.sfx('click'); closeSheet(); };
  hd.appendChild(im); hd.appendChild(h2); hd.appendChild(x); sh.appendChild(hd);
  var body=document.createElement('div'); body.className='body'; sh.appendChild(body);
  if(kind==='workshop'){
    UPS.forEach(function(u){
      var lv=lvl(u.id), row=document.createElement('div'); row.className='up';
      var ic=document.createElement('img'); ic.src=iconURL(u.ico,88); ic.alt='';
      var mid=document.createElement('div'); mid.innerHTML='<div class="n"></div><div class="d"></div><div class="dots"></div>'; mid.querySelector('.n').textContent=l.ups[u.id][0]; mid.querySelector('.d').textContent=l.ups[u.id][1];
      var dots=mid.querySelector('.dots'); for(var i=0;i<u.max;i++){ var d=document.createElement('i'); if(i<lv) d.className='on'; dots.appendChild(d); }
      var btn=document.createElement('button'); btn.className='buy';
      if(lv>=u.max){ btn.classList.add('max'); btn.textContent=l.max; btn.disabled=true; }
      else { var cost=upCost(u,lv); btn.innerHTML='<img alt=""><span></span>'; btn.querySelector('img').src=iconURL('coin',40); btn.querySelector('span').textContent=fmt(cost); btn.disabled=S.coins<cost; btn.dataset.cost=cost;
        btn.onclick=function(){ var c=upCost(u,lvl(u.id)); if(S.coins<c||lvl(u.id)>=u.max) return; S.coins-=c; S.up[u.id]=lvl(u.id)+1; AudioSys.sfx('buy'); player.visDirty=true; dirty=true; openSheet('workshop'); writeSave(); }; }
      row.appendChild(ic); row.appendChild(mid); row.appendChild(btn); body.appendChild(row);
    });
  } else {
    var gain=crownGain(), can=S.runEarned>=PRESTIGE_MIN;
    var wrap=document.createElement('div'); wrap.className='pres'; body.appendChild(wrap);
    var p=document.createElement('p'); p.textContent=l.presText; wrap.appendChild(p);
    var big=document.createElement('div'); big.className='big'; big.innerHTML='<span></span><img alt=""><span></span>'; big.children[0].textContent=l.presGet; big.children[1].src=iconURL('crown',96); big.children[2].textContent='+'+gain; wrap.appendChild(big);
    var btn2=document.createElement('button'); btn2.className='wide'; btn2.textContent=can?l.presBtn:fmtT(l.presNeed,{n:fmt(PRESTIGE_MIN-S.runEarned)}); btn2.disabled=!can; btn2.onclick=function(){ if(S.runEarned>=PRESTIGE_MIN) doPrestige(); }; wrap.appendChild(btn2);
  }
}
function refreshSheetButtons(){ if(sheetKind!=='workshop') return; var bs=$('sheet').querySelectorAll('.buy[data-cost]'); for(var i=0;i<bs.length;i++){ bs[i].disabled=S.coins<+bs[i].dataset.cost; } }
function closeSheet(){ sheetKind=null; $('sheet').hidden=true; $('sheet').innerHTML=''; }
function crownGain(){ return Math.max(1,Math.floor(Math.sqrt(S.runEarned/PRESTIGE_MIN))); }
function doPrestige(){
  var g=crownGain(); var keep={crowns:S.crowns+g,totalEarned:S.totalEarned,lang:LANG,muted:S.muted,tutDone:true};
  closeSheet(); S=freshState(keep); S.quest={i:0,gen:0,cur:null};
  resetWorld(); AudioSys.sfx('quest'); toast(fmtT(L().crowned,{n:g})); writeSave(); maybeInterstitial();
}
function resetWorld(){
  scene.remove(dyn); dyn=new THREE.Group(); scene.add(dyn);
  machines={}; sources={}; stalls={}; bots=[]; tiles={}; decors={}; customers=[]; obstacles=[]; workshopE=null; obsE=null; vipActive=null;
  signs=signs.filter(function(s){ return s.kind==='zone'; });
  gates.forEach(function(g){ g.userData.open=false; g.visible=true; g.position.y=0; });
  player.stack=S.stack||[]; player.visDirty=true; player.pos.set(0,0,7); if(S.pos && walkableRaw(S.pos[0],S.pos[1])){ player.pos.set(S.pos[0],0,S.pos[1]); }
  DEFS.forEach(function(d){ if(S.unlocked[d.id]) build(d); });
  refreshTiles(); setLang(LANG); renderQuest(); if(!inTut() && !S.quest.cur) newQuest();
}
function walkableRaw(x,z){ return walkable(x,z); }

/* ================= ads ================= */
function fakeAd(){
  return new Promise(function(res){ var el=$('ad'); el.hidden=false; var n=3; $('adCd').textContent=n; var l=L(); $('adSub').textContent=l.adSub+' · '+l.adEnd;
    var iv=setInterval(function(){ n--; $('adCd').textContent=Math.max(n,0); if(n<=0){ clearInterval(iv); el.hidden=true; res(true); } },1000); });
}
function adPause(on){ simPaused=on; AudioSys.adMute=on; AudioSys.apply(); }
function maybeInterstitial(){
  if(inTut()||adBusy||COVER) return; var now=performance.now()/1000; if(now-lastAdAt<150) return;
  lastAdAt=now; adBusy=true; adPause(true);
  var done=function(){ adBusy=false; adPause(false); lastAdAt=performance.now()/1000; };
  if(IN_YT){ try{ YT.ads.requestInterstitialAd().then(done,done); }catch(e){ done(); } } else fakeAd().then(done);
}
function rewarded(id){
  return new Promise(function(res){
    if(adBusy){ res(false); return; } adBusy=true; adPause(true);
    var fin=function(ok){ adBusy=false; adPause(false); lastAdAt=performance.now()/1000; res(!!ok); };
    if(IN_YT){ try{ YT.ads.requestRewardedAd(id).then(fin,function(){ fin(false); }); }catch(e){ fin(false); } } else fakeAd().then(fin);
  });
}

/* ================= main loop ================= */
var running=false, simPaused=false, sysPaused=false, DT_MAX=window.__DTMAX||0.05;
function frame(){
  requestAnimationFrame(frame);
  var dt=Math.min(clock.getDelta(),DT_MAX);
  if(sysPaused) return;
  if(running && !simPaused){
    updatePlayer(dt); updateSources(dt); updateMachines(dt); updateBots(dt); updateCustomers(dt); updateTutorial(dt); updateQuest(); updateArrows(dt);
    if(S.boostLeft>0){ S.boostLeft=Math.max(0,S.boostLeft-dt); }
    incomeEMA += ((incAcc/dt)-incomeEMA)*Math.min(1,dt/40); incAcc=0; fullWarn-=dt;
    saveTimer+=dt; if(saveTimer>8){ saveTimer=0; if(dirty) writeSave(); }
    updateHUD(dt); refreshSheetButtonsThrottle(dt);
  } else if(!running){ // start screen idle orbit
    var t=performance.now()/1000*0.12; camera.position.set(Math.sin(t)*22,15,Math.cos(t)*22-4); camera.lookAt(0,0,-4);
    updateSources(dt); updateMachines(dt);
  }
  if(COVER) coverUpdate(dt);
  else if(running) updateCamera(dt);
  updateWorld(dt);
  AudioSys.tick();
  renderer.render(scene,camera);
}
var sheetThr=0; function refreshSheetButtonsThrottle(dt){ sheetThr-=dt; if(sheetThr<=0){ sheetThr=0.25; refreshSheetButtons(); } }

/* ================= cover mode ================= */
var coverT=0;
function coverUpdate(dt){
  coverT+=dt;
  if(running){ updatePlayer(0.0001); }
  var c=COVER, t=c.cam||{};
  camera.position.set(t.px!=null?t.px:6,t.py!=null?t.py:13,t.pz!=null?t.pz:14); camera.lookAt(t.lx!=null?t.lx:-1,0,t.lz!=null?t.lz:-5);
  camera.fov=t.fov||45; camera.updateProjectionMatrix();
  sun.position.set(10,24,12); sun.target.position.set(0,0,-4);
  if(coverT>2.5) window.__COVER_READY__=true;
}
function setupCover(){
  DEFS.forEach(function(d){ S.unlocked[d.id]=true; });
  S.tut=-1;
}

/* ================= boot ================= */
function hookSystem(){
  if(IN_YT){
    try{ AudioSys.ytOn=!!YT.system.isAudioEnabled(); }catch(e){}
    try{ YT.system.onAudioEnabledChange(function(on){ AudioSys.ytOn=!!on; AudioSys.apply(); renderMute(); }); }catch(e){}
    try{ YT.system.onPause(function(){ sysPaused=true; AudioSys.paused=true; AudioSys.apply(); writeSave(); }); }catch(e){}
    try{ YT.system.onResume(function(){ sysPaused=false; AudioSys.paused=false; AudioSys.apply(); clock.getDelta(); }); }catch(e){}
  }
  document.addEventListener('visibilitychange',function(){ if(document.hidden){ AudioSys.paused=true; AudioSys.apply(); if(running) writeSave(); } else if(!sysPaused){ AudioSys.paused=false; AudioSys.apply(); clock.getDelta(); } });
  window.addEventListener('pagehide',function(){ if(running) writeSave(); });
}
function detectLang(){
  return new Promise(function(res){
    if(IN_YT){ try{ YT.system.getLanguage().then(function(l){ res(/^ar/i.test(l||'')?'ar':'en'); },function(){ res('en'); }); }catch(e){ res('en'); } }
    else res(/^ar/i.test(navigator.language||'')?'ar':'en');
  });
}
function wireUI(){
  $('icoCoin').src=iconURL('coin',64); $('icoCrown').src=iconURL('crown',64); $('icoVip').src=iconURL('crown',64);
  document.querySelectorAll('.qcoin').forEach(function(i){ i.src=iconURL('coin',40); });
  $('giftB').textContent=''; var gi=document.createElement('img'); gi.src=iconURL('gift',64); gi.alt=''; gi.style.width='30px'; gi.style.height='30px'; $('giftB').appendChild(gi);
  $('lAr').onclick=function(){ AudioSys.init(); AudioSys.sfx('click'); setLang('ar'); writeSave(); };
  $('lEn').onclick=function(){ AudioSys.init(); AudioSys.sfx('click'); setLang('en'); writeSave(); };
  $('btnLang').onclick=function(){ AudioSys.sfx('click'); setLang(LANG==='ar'?'en':'ar'); writeSave(); };
  $('btnMute').onclick=function(){ AudioSys.init(); S.muted=!S.muted; AudioSys.apply(); renderMute(); AudioSys.sfx('click'); dirty=true; };
  $('btnPlay').onclick=function(){ AudioSys.init(); AudioSys.apply(); AudioSys.sfx('unlock'); startGame(); };
  $('btnBoost').onclick=function(){ AudioSys.sfx('click'); rewarded('double_coins').then(function(ok){ if(ok){ S.boostLeft=180; toast(L().boostOn); AudioSys.sfx('quest'); dirty=true; } }); };
  $('btnGift').onclick=function(){ AudioSys.sfx('click'); rewarded('free_gift').then(function(ok){ if(ok){ var g=giftAmount(); addCoins(g,player.pos); toast(fmtT(L().giftGot,{n:fmt(g)})); $('btnGift').hidden=true; giftShowT=0; giftT=rnd(170,230); } }); };
}
function startGame(){
  $('start').hidden=true; $('hud').hidden=false; running=true; $('c').focus();
  lastAdAt=performance.now()/1000; renderQuest();
  if(!inTut() && !S.quest.cur) newQuest();
}
function boot(){
  initThree(); buildWorld(); buildArrows();
  camera.position.set(0,15,18); camera.lookAt(0,0,-4); renderer.render(scene,camera);
  if(IN_YT){ try{ YT.game.firstFrameReady(); }catch(e){} }
  hookSystem(); initInput(); wireUI();
  var fontP=(document.fonts&&document.fonts.load)?Promise.all([document.fonts.load(fontStr(40)+'','Aa'),document.fonts.load(fontStr(40),'عربي')]).catch(function(){}):Promise.resolve();
  var timeout=new Promise(function(r){ setTimeout(r,2500); });
  Promise.all([loadSave(), detectLang(), Promise.race([fontP,timeout])]).then(function(r){
    var save=r[0], lang=r[1];
    if(save) mergeSave(save);
    if(COVER) setupCover();
    LANG = COVER&&COVER.lang ? COVER.lang : (S.lang||lang);
    buildPlayer(); resetWorld(); renderMute();
    $('loading').hidden=true;
    if(COVER){ running=true; $('hud').hidden=true; coverPopulate(); }
    else { $('start').hidden=false; }
    if(IN_YT){ try{ YT.game.gameReady(); }catch(e){} }
    clock.getDelta(); frame();
  });
}
function coverPopulate(){
  signs.forEach(function(sg){ sg.obj.g.visible=false; });
  player.pos.set(1.5,0,4.5); player.face=0.6; player.stack=['candy','candy','mallow','candy','cloud','cloud','mallow']; player.visDirty=true;
  Object.keys(machines).forEach(function(k){ machines[k].out=5; machines[k].working=true; machines[k].visDirty=true; });
  Object.keys(stalls).forEach(function(k){ var st=stalls[k]; st.products.forEach(function(p){ st.shelf[p]=8; }); st.visDirty=true; for(var i=0;i<3;i++){ var c=spawnCustomer(st,i===0&&k==='stall1'); if(c){ c.pos.copy(st.slots[i]); c.state='wait'; } } st.serve=99; });
  bots.forEach(function(b,i){ b.pos.x+=rnd(-1,1); b.stack=['cloud','candy']; b.visDirty=true; });
}
window.addEventListener('error',function(){ try{ if(IN_YT&&YT.health) YT.health.logError(); }catch(e){} });
if(window.__TEST__) window.__game={get S(){return S;},unlock:unlock,addCoins:addCoins,machines:function(){return machines;},tiles:function(){return tiles;},player:function(){return player;},setLang:setLang,stalls:function(){return stalls;},bots:function(){return bots;},customers:function(){return customers;},rewarded:rewarded,maybeInterstitial:maybeInterstitial,writeSave:writeSave,doPrestige:doPrestige,keys:keys};
boot();
})();
